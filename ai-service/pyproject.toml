[project]
name = "nexora-ai-service"
version = "0.0.1"
description = "Nexora stateless Python AI service (internal only)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "openapi-spec-validator>=0.9.0",
    "pytest",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["."]
