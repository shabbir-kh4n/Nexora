openapi: 3.1.0
info:
  title: Nexora public API (React to Java)
  version: 0.1.0
  description: >-
    Initial walking-skeleton contract. Unauthenticated, development-only and restricted to localhost.
    Run state is held in memory and is not durable. The event schemas are identical to the internal
    contract because Java relays Python events verbatim; a test keeps the two copies equal.
    Lifecycle: QUEUED, RUNNING, then COMPLETED, FAILED or CANCELLED. A run becomes RUNNING when the Java
    executor starts processing it, before the AI service is called, and may go from QUEUED straight to
    FAILED when execution cannot start. Terminal states are immutable, and a late upstream event never
    overwrites one. No cancelled event exists; after a cancellation the client
    reads the final state from the run snapshot.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      summary: Liveness only
      responses:
        "200":
          description: The service is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    const: ok
  /api/v1/runs:
    post:
      summary: Create a run and stream its events
      description: >-
        Streams Server-Sent Events: `event: <type>` followed by `data: <EventEnvelope as JSON>`.
        `done` and `error` are terminal and nothing follows them. After a cancellation the stream ends
        without a terminal event and the client reads CANCELLED from `GET /api/v1/runs/{runId}`.
        A `heartbeat` event is sent every 15 seconds while the stream is idle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: Event stream; see EventEnvelope for the data of each frame.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/runs/{runId}:
    get:
      summary: Run status, accumulated output and steps
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Snapshot of the run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSnapshot"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/runs/{runId}/cancel:
    post:
      summary: Request cooperative cancellation
      description: >-
        Idempotent. A QUEUED or RUNNING run becomes CANCELLED and keeps its partial output. A run that is
        already CANCELLED, COMPLETED or FAILED is returned unchanged.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Snapshot of the run after the request, with the same schema as GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSnapshot"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RunId"
  responses:
    Error:
      description: Error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    RunId:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      description: >-
        Canonical lower-case dashed UUID, as produced by Java's UUID.toString(). Uppercase, braces,
        missing dashes and URN prefixes are rejected, and ids are never matched case-insensitively.
    RunRequest:
      type: object
      required: [question]
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
    RunSnapshot:
      type: object
      description: >-
        Sources and verification are not part of this snapshot yet. The `error` object is required when
        the status is FAILED and must be absent for every other status.
      required: [run_id, status, output, steps, created_at, updated_at]
      additionalProperties: false
      if:
        properties:
          status:
            const: FAILED
      then:
        required: [error]
      else:
        not:
          required: [error]
      properties:
        run_id:
          $ref: "#/components/schemas/RunId"
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED]
        output:
          type: string
          description: Accumulated partial or final answer text.
        steps:
          type: array
          description: Progress messages received so far, in order.
          items:
            type: object
            required: [message]
            additionalProperties: false
            properties:
              message:
                type: string
                minLength: 1
        created_at:
          type: string
          format: date-time
          pattern: "Z$"
          description: ISO-8601 UTC.
        updated_at:
          type: string
          format: date-time
          pattern: "Z$"
          description: ISO-8601 UTC.
        error:
          $ref: "#/components/schemas/ErrorResponse/properties/error"
          description: >-
            Why the run failed. Stable code and a generic, user-safe message; never exception details,
            internal URLs, credentials or stack traces.
    ErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - RUN_NOT_FOUND
        - INTERNAL_AUTH_FAILED
        - UPSTREAM_UNAVAILABLE
        - UPSTREAM_STREAM_INVALID
        - UPSTREAM_STREAM_TRUNCATED
        - INTERNAL_ERROR
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
    EventBase:
      type: object
      required: [version, event_id, run_id, type, timestamp, data]
      properties:
        version:
          const: "1"
        event_id:
          type: string
          format: uuid
        run_id:
          $ref: "#/components/schemas/RunId"
        timestamp:
          type: string
          format: date-time
    StepEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type:
              const: step
            data:
              type: object
              required: [message]
              additionalProperties: false
              properties:
                message:
                  type: string
                  minLength: 1
      unevaluatedProperties: false
    TokenEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type:
              const: token
            data:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text:
                  type: string
                  minLength: 1
      unevaluatedProperties: false
    DoneEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type:
              const: done
            data:
              type: object
              maxProperties: 0
      unevaluatedProperties: false
    HeartbeatEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type:
              const: heartbeat
            data:
              type: object
              maxProperties: 0
      unevaluatedProperties: false
    ErrorEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type:
              const: error
            data:
              $ref: "#/components/schemas/ErrorResponse/properties/error"
      unevaluatedProperties: false
    EventEnvelope:
      oneOf:
        - $ref: "#/components/schemas/StepEvent"
        - $ref: "#/components/schemas/TokenEvent"
        - $ref: "#/components/schemas/DoneEvent"
        - $ref: "#/components/schemas/HeartbeatEvent"
        - $ref: "#/components/schemas/ErrorEvent"
      discriminator:
        propertyName: type
        mapping:
          step: "#/components/schemas/StepEvent"
          token: "#/components/schemas/TokenEvent"
          done: "#/components/schemas/DoneEvent"
          heartbeat: "#/components/schemas/HeartbeatEvent"
          error: "#/components/schemas/ErrorEvent"
