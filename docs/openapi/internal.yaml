openapi: 3.1.0
info:
  title: Nexora internal API (Java to Python)
  version: 0.1.0
  description: >-
    S1 walking-skeleton contract. The Python service runs a fixed fake agent script.
    Authenticated with a shared secret that fails closed; the health endpoint is exempt.
servers:
  - url: http://127.0.0.1:8000
security:
  - InternalSecret: []
paths:
  /internal/v1/health:
    get:
      summary: Liveness only
      security: []
      responses:
        "200":
          description: The service is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    const: ok
  /internal/v1/runs:
    post:
      summary: Start a fake agent run and stream its events
      description: >-
        Streams Server-Sent Events. Each frame is `event: <type>` followed by `data: <EventEnvelope as JSON>`.
        `done` and `error` are terminal and nothing follows them. A cancelled run ends without a terminal event.
        A `heartbeat` event is sent every 15 seconds while the stream is idle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: Event stream; see EventEnvelope for the data of each frame.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /internal/v1/runs/{runId}/cancel:
    post:
      summary: Request cooperative cancellation
      description: Idempotent. An unknown or already finished run counts as already done.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Cancellation requested or nothing to cancel.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    InternalSecret:
      type: apiKey
      in: header
      name: X-Nexora-Internal-Secret
  responses:
    Error:
      description: Error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    RunRequest:
      type: object
      required: [run_id, question]
      additionalProperties: false
      properties:
        run_id:
          type: string
          format: uuid
        question:
          type: string
          minLength: 1
          maxLength: 2000
    ErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - RUN_NOT_FOUND
        - INTERNAL_AUTH_FAILED
        - UPSTREAM_UNAVAILABLE
        - UPSTREAM_STREAM_INVALID
        - UPSTREAM_STREAM_TRUNCATED
        - INTERNAL_ERROR
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
    EventBase:
      type: object
      required: [version, event_id, run_id, type, timestamp, data]
      properties:
        version:
          const: "1"
        event_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
    StepEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type:
              const: step
            data:
              type: object
              required: [message]
              additionalProperties: false
              properties:
                message:
                  type: string
                  minLength: 1
      unevaluatedProperties: false
    TokenEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type:
              const: token
            data:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text:
                  type: string
                  minLength: 1
      unevaluatedProperties: false
    DoneEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type:
              const: done
            data:
              type: object
              maxProperties: 0
      unevaluatedProperties: false
    HeartbeatEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type:
              const: heartbeat
            data:
              type: object
              maxProperties: 0
      unevaluatedProperties: false
    ErrorEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type:
              const: error
            data:
              $ref: "#/components/schemas/ErrorResponse/properties/error"
      unevaluatedProperties: false
    EventEnvelope:
      oneOf:
        - $ref: "#/components/schemas/StepEvent"
        - $ref: "#/components/schemas/TokenEvent"
        - $ref: "#/components/schemas/DoneEvent"
        - $ref: "#/components/schemas/HeartbeatEvent"
        - $ref: "#/components/schemas/ErrorEvent"
      discriminator:
        propertyName: type
        mapping:
          step: "#/components/schemas/StepEvent"
          token: "#/components/schemas/TokenEvent"
          done: "#/components/schemas/DoneEvent"
          heartbeat: "#/components/schemas/HeartbeatEvent"
          error: "#/components/schemas/ErrorEvent"
